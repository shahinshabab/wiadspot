# Serves the bare IP (/client/, /owner/, ... paths) and the domain with its
# subdomains. Replace nothing here: `server_name _` also matches the IP.
server {
    listen 80 default_server;
    server_name _ wiadspot.com www.wiadspot.com
                client.wiadspot.com owner.wiadspot.com
                manager.wiadspot.com admin.wiadspot.com;

    client_max_body_size 10m;

    location /static/ { alias /srv/wiadspot/staticfiles/; }
    location /media/  { alias /srv/wiadspot/media/; }

    location / {
        proxy_pass http://unix:/srv/wiadspot/gunicorn.sock;
        proxy_set_header Host $http_host;   # keep the original host (and port)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
