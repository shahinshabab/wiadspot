{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}WiadSpot · Make every connection count{% endblock %}</title>
        <link rel="icon" href="{% static 'images/logo/favicon.ico' %}" sizes="any">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/logo/favicon-32.png' %}">
        <link rel="apple-touch-icon" href="{% static 'images/logo/apple-touch-icon.png' %}">
        <meta name="theme-color" content="#002f4f">
        <meta property="og:title" content="WiadSpot · Make every connection count">
        <meta property="og:type" content="website">
        <meta property="og:image" content="{% static 'images/logo/og-image.png' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
        <link rel="stylesheet"
              href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
        <link rel="stylesheet"
              href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/platform.css' %}">
        <link rel="stylesheet" href="{% static 'css/marketplace.css' %}">
        {% block extra_head %}{% endblock %}
    </head>
    <body class="{% block body_class %}{% endblock %}">
        <a class="skip-link" href="#main-content">Skip to content</a>
        {% block body %}{% endblock %}
        <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'js/platform.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
