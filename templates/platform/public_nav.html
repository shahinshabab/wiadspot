<header class="public-nav">
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
        <div class="container px-4">
            <a class="brand" href="{% url 'landing' %}">{% include "platform/brand.html" %}</a>
            <button class="navbar-toggler border-0"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#publicNavigation"
                    aria-controls="publicNavigation"
                    aria-expanded="false"
                    aria-label="Open menu">
                <i aria-hidden="true" class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="publicNavigation">
                {% with current=request.resolver_match.url_name %}
                    <div class="navbar-nav mx-auto">
                        <a class="nav-link {% if current == 'landing' %}active{% endif %}"
                           href="{% url 'landing' %}">Home</a>
                        <a class="nav-link {% if current == 'landing_about' %}active{% endif %}"
                           href="{% url 'landing_about' %}">About</a>
                        <a class="nav-link {% if current == 'landing_articles' or current == 'landing_article_read' %}active{% endif %}"
                           href="{% url 'landing_articles' %}">Articles</a>
                        <a class="nav-link {% if current == 'landing_career' %}active{% endif %}"
                           href="{% url 'landing_career' %}">Careers</a>
                        <a class="nav-link {% if current == 'landing_contact' %}active{% endif %}"
                           href="{% url 'landing_contact' %}">Contact</a>
                    </div>
                {% endwith %}
                <div class="dropdown py-2 signin-menu">
                    <button class="btn btn-brand dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">Sign in</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li class="signin-title">Choose your workspace</li>
                        <li><a class="dropdown-item signin-option"
   href="{{ client_login_url }}"><span class="signin-icon"><i class="bi bi-image" aria-hidden="true"></i></span><span class="signin-text"><strong>Client · Advertiser</strong><small>Submit posters and track campaigns</small></span><i class="bi bi-arrow-right signin-arrow" aria-hidden="true"></i></a></li>
                        <li><a class="dropdown-item signin-option"
   href="{{ owner_login_url }}"><span class="signin-icon"><i class="bi bi-geo-alt" aria-hidden="true"></i></span><span class="signin-text"><strong>Location owner</strong><small>Manage your places and visitors</small></span><i class="bi bi-arrow-right signin-arrow" aria-hidden="true"></i></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
