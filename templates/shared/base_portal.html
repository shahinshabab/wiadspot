{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WIADSPOT{% endblock %}</title>

    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
</head>
<body class="bg-body-tertiary">

    {% include "shared/components/navbar.html" %}

    <div class="container-fluid">
        <div class="row">
            <!-- Desktop Sidebar -->
            <aside class="d-none d-md-block col-md-3 col-lg-2 px-0">
                <div class="position-sticky top-0 vh-100 pt-5">
                    <div class="bg-body border-end h-100 overflow-auto pt-4">
                        {% include "shared/components/sidebar.html" %}
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="col-12 col-md-9 col-lg-10 ms-auto pt-5">
                <div class="p-3 p-md-4 p-lg-4">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Mobile Sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="mobileSidebarLabel">WIADSPOT</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0">
            {% include "shared/components/sidebar.html" %}
        </div>
    </div>

    <script>
        (function () {
            const html = document.documentElement;
            const savedTheme = localStorage.getItem("wiadspot-theme");
            const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const initialTheme = savedTheme || (systemDark ? "dark" : "light");
            html.setAttribute("data-bs-theme", initialTheme);

            document.addEventListener("DOMContentLoaded", function () {
                const toggleBtn = document.getElementById("themeToggleBtn");
                const toggleIcon = document.getElementById("themeToggleIcon");
                const toggleText = document.getElementById("themeToggleText");

                function updateThemeUI(theme) {
                    if (!toggleIcon || !toggleText) return;
                    if (theme === "dark") {
                        toggleIcon.className = "bi bi-sun me-2";
                        toggleText.textContent = "Light Mode";
                    } else {
                        toggleIcon.className = "bi bi-moon-stars me-2";
                        toggleText.textContent = "Dark Mode";
                    }
                }

                updateThemeUI(html.getAttribute("data-bs-theme"));

                if (toggleBtn) {
                    toggleBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const currentTheme = html.getAttribute("data-bs-theme");
                        const newTheme = currentTheme === "dark" ? "light" : "dark";
                        html.setAttribute("data-bs-theme", newTheme);
                        localStorage.setItem("wiadspot-theme", newTheme);
                        updateThemeUI(newTheme);
                    });
                }
            });
        })();
    </script>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
