{{ form.non_field_errors }}
{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %} <span class="text-muted">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="text-danger small mt-1" role="alert">{{ error }}</div>{% endfor %}</div>{% endif %}{% endfor %}
