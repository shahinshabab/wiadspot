name: Deploy dev to Wiadspot
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiadspot-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, Linux, wiadspot-prod]
    timeout-minutes: 20
    steps:
      - name: Deploy this dev commit as wiadspot
        shell: bash
        env:
          WIADSPOT_DEPLOY_SHA: ${{ github.sha }}
          WIADSPOT_DEPLOY_BRANCH: dev
        run: |
          set -euo pipefail
          sudo -n -u wiadspot env WIADSPOT_DEPLOY_SHA="$WIADSPOT_DEPLOY_SHA" WIADSPOT_DEPLOY_BRANCH="$WIADSPOT_DEPLOY_BRANCH" bash /srv/wiadspot/deploy/deploy.sh
